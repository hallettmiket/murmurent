news:
- date: 2026-11-07
  title: One short movie per agent
  summary: Sixteen two-minute movies, one per commons agent, each with a real run, at the videos page.
  link: https://mikehallett.science/assets/videos/
- date: 2026-11-07
  title: Paper packages, thesis packages and the docent
  summary: A paper or a thesis becomes a package an examiner can question in Claude Code; the docent answers with locations and logs every question. Six-minute video.
  link: https://mikehallett.science/assets/videos/murmurent_thesis_package.html
- date: 2026-11-02
  title: Release 2026.11.0, repositories and projects settled
  summary: A repository may belong to several projects, membership grants access on every one, readiness travels with the clone, and a collaborator from another lab can finish joining from the message they receive.
  link: https://github.com/hallettmiket/murmurent/blob/main/CHANGELOG.md
- date: 2026-10-30
  title: Release 2026.10.8, one route for every Slack note
  summary: Every release note, job notice and status update follows the same route to a project's channel, and the lab's channel otherwise.
  link: https://github.com/hallettmiket/murmurent/blob/main/CHANGELOG.md
- date: 2026-10-19
  title: Release 2026.10.5, citations checked and the vault syncs itself
  summary: murmurent cite check looks up every DOI, PMID and arXiv identifier; the personal vault follows you between machines; spoken verdicts on macOS.
  link: https://github.com/hallettmiket/murmurent/blob/main/CHANGELOG.md
- date: 2026-10-14
  title: The getting-started video
  summary: Seven minutes from a fresh machine to a working lab member.
  link: https://mikehallett.science/assets/videos/murmurent_getting_started.html

