# The training videos and the news about murmurent, in one file (issue #289).
#
# Three lists. `videos:` are the standalone videos (hand-kept: title, date, the
# page on the site, the version checked against, chapters). `movies:` are the
# one-per-agent movies, written by training/lib/agent_movie.py on every render
# (do not edit by hand) and read by the agent_movie hook, which prompts to
# re-render when agents/<x>.md changes. `news:` is one line per release or new
# capability, newest first, the same bar as CHANGELOG.md: not every merged PR.
#
# training/front_page.py writes, from this file, the "Videos and news" section
# of README.md and release/README_public.md, and the page at
# https://mikehallett.science/assets/videos/ on the site.
