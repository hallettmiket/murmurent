[project]
name = "murmurent"
# Single source of truth: the version is read from src/murmurent/__init__.py
# (see [tool.hatch.version] below), so `murmurent --version`, the package
# metadata, and the bootstrap_version stamped into repo markers can never
# disagree — which they did (issue #24: pyproject said 1.0.0 while the runtime
# reported 0.1.0). Bump the version in exactly one place: __init__.py.
dynamic = ["version"]
description = "Multi-group agentic infrastructure for a bioconvergence centre — with the v1 registrar layer above any single lab."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Mike Hallett", email = "michael.hallett@uwo.ca" },
]
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.7",
    # Runtime deps for the hi-fi dashboard (FastAPI server), Slack comms, and
    # the MCP servers. Kept as HARD deps — NOT optional extras — on purpose:
    # `uv` does not persist an editable tool's extras in its receipt, so any
    # bare `uv tool install .` / `--reinstall .` / re-sync silently dropped them
    # and repeatedly broke `murmurent dashboard`. As base deps they install no
    # matter how murmurent is installed. Only heavy streamlit (low-fi dashboard)
    # stays optional, under the `dashboard` extra below.
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
    "slack-sdk>=3.30",
    "anthropic>=0.40",
    "mcp>=1.0",
    # ed25519 identity-card signing (core/idkeys.py). Hard dep — the identity
    # chain must be available in every install, not gated behind an extra.
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/hallettmiket/murmurent"
Documentation = "https://hallettmiket.github.io/murmurent/"
# Issues are disabled on the release repo on purpose; bug reports and feature
# requests go to the development repo, where the history and the PRs are.
Issues = "https://github.com/hallettmiket/murmurent_dev/issues"
Source = "https://github.com/hallettmiket/murmurent"
Changelog = "https://github.com/hallettmiket/murmurent/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "isort>=5.13",
]
docs = [
    "mkdocs-material>=9.5",
]
mcp = [
    "mcp>=1.0",
]
dashboard = [
    "streamlit>=1.30",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]
slack = [
    "slack-sdk>=3.30",
    "anthropic>=0.40",
]
gcal = [
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]

[project.scripts]
murmurent = "murmurent.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Version is read from the ``__version__ = "..."`` assignment in this file —
# the one place the number is edited. Hatchling supports this natively, no
# extra dependency.
[tool.hatch.version]
path = "src/murmurent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/murmurent"]
# rules/local/ is this deployment's own rules (private repos, Slack IDs). It is
# withheld from the public repo, but a wheel built from the DEV clone would
# otherwise embed it via the force-include below. Exclude it in both places.
exclude = ["rules/local", "rules/local/**"]

# Ship the commons INSIDE the wheel. Without this, `uv tool install murmurent`
# gives you the CLI but none of the agents, rules or skills it exists to wire
# up, so a PyPI install could not stand on its own and always needed a clone.
# They land under murmurent/commons/ and are found by core.commons.commons_root().
[tool.hatch.build.targets.wheel.force-include]
"agents" = "murmurent/commons/agents"
"rules" = "murmurent/commons/rules"
"skills" = "murmurent/commons/skills"
"templates" = "murmurent/commons/templates"
# CLAUDE.md is what tells a Claude Code session what murmurent is. A package
# install that omits it leaves the agents wired but unexplained.
"CLAUDE.md" = "murmurent/commons/CLAUDE.md"

[tool.hatch.build.targets.sdist]
# The sdist is what PyPI keeps as the buildable source, so it needs the same
# commons the wheel force-includes.
include = [
    "src/murmurent",
    "agents",
    "rules",
    "skills",
    "templates",
    "scripts",
    "docs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CLAUDE.md",
    "pyproject.toml",
]
exclude = [
    "rules/local",
    "rules/local/**",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
